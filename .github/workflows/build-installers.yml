# 按需打包安装包（Mac Apple Silicon arm64 / Intel x64 / Windows x64）
#
# 与既有 release.yml（PR 合并触发、签名 + R2 + GitHub Release 的重型发布流水线）
# 不同：本工作流是「手动触发、只产出安装包 artifact」的轻量构建，用于在 Linux
# 本机无法产出 macOS 包时，借 GitHub 的 macOS/Windows runner 云端打包。
#
# - 触发：Actions 页面手动 Run workflow（workflow_dispatch），或推 v* / win-v* tag。
#   push 到 ci/build-installers 分支也会自动打包（仅 artifact，不发 Release），
#   版本号 0.1.0-ci.<run_number>。
# - 产物：作为 workflow artifacts 上传，构建完在 run 页面下载，保留 14 天。
#   tag 触发时由独立 publish-release job 汇总 Windows + macOS 产物发布为
#   GitHub Release（tag 统一为 v<version>），供应用内更新（electron-updater
#   GitHub provider）拉取 latest.yml / latest-mac.yml。
# - macOS 默认「无签名」（ad-hoc）：可安装，但首次打开需在「系统设置 → 隐私与
#   安全性」放行（或右键→打开）。若已配置 Apple 签名 secret，设 mac_sign=true 走签名。
# - 各平台原生模块（node-pty / better-sqlite3 / @computer-use/nut-js）在对应
#   runner 上原生编译，无跨平台交叉编译问题。

name: Build Installers

on:
  # 手动触发：Actions 页面 Run workflow。
  workflow_dispatch:
    inputs:
      mac_sign:
        description: '对 macOS 包做 Developer ID 签名+公证（需已配置 Apple secret）'
        type: boolean
        default: false
      only_windows:
        description: '仅打 Windows x64（跳过 macOS job）'
        type: boolean
        default: false
  # tag 触发：推 v* 三平台；推 win-v*（如 win-v0.1.3-test.1）只打 Windows x64。
  # 产物版本号取自标签（去掉 win-/v 前缀），须为合法 semver。
  # 分支触发：push 到 ci/build-installers → 三平台自动打包（仅 artifact，不发
  # Release，不进更新通道）；连续 commit 由 concurrency cancel-in-progress 去重。
  push:
    branches:
      - ci/build-installers
    tags:
      - 'v*'
      - 'win-v*'

permissions:
  # 需要 contents: write 才能用内置 GITHUB_TOKEN 创建/上传 GitHub Release
  # （应用内更新的 electron-updater GitHub provider 从 Release 拉 latest.yml）。
  contents: write

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── macOS：Apple Silicon 与 Intel 分开在原生架构 runner 上打 dmg/zip ─────
  build-macos:
    name: Build macOS (${{ matrix.chip_name }})
    # 仅 win 场景跳过 macOS：win-v* tag 或手动勾选 only_windows。
    if: ${{ !startsWith(github.ref, 'refs/tags/win-v') && github.event.inputs.only_windows != 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip_name: Intel x64
            arch: x64
            runner: macos-15-intel
            artifact_name: Claude360-Copilot-macOS-Intel-x64
          - chip_name: Apple Silicon arm64
            arch: arm64
            runner: macos-15
            artifact_name: Claude360-Copilot-macOS-Apple-Silicon-arm64
    env:
      # 无签名构建：关闭 electron-builder 的钥匙串签名身份自动发现，避免误签/告警。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tag 触发时，用标签名（去掉前导 v）作为发布版本号，供 electron-builder 命名。
      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "CLAUDE360_APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # 分支 push 的 CI 构建：版本号 0.1.0-ci.N（合法 semver prerelease）。
      # CI 构建不进 Release/更新通道，版本仅用于产物命名与追踪。
      - name: Resolve CI version for branch build
        if: github.ref == 'refs/heads/ci/build-installers'
        shell: bash
        run: echo "CLAUDE360_APP_VERSION=0.1.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # 可选签名：仅当手动勾选 mac_sign 且仓库配好 Apple secret 时启用。
      - name: Decode Apple signing credentials
        if: ${{ inputs.mac_sign }}
        env:
          MAC_CODESIGN_P12_BASE64: ${{ secrets.MAC_CODESIGN_P12_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in MAC_CODESIGN_P12_BASE64 CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret: ${name} (mac_sign 需要完整 Apple 凭据)"
              exit 1
            fi
          done
          cert_path="${RUNNER_TEMP}/developer-id.p12"
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          export CERT_PATH="${cert_path}" KEY_PATH="${key_path}"
          node <<'NODE'
          const fs = require('node:fs')
          fs.writeFileSync(process.env.CERT_PATH, Buffer.from(process.env.MAC_CODESIGN_P12_BASE64, 'base64'))
          fs.writeFileSync(process.env.KEY_PATH, Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64'))
          NODE
          {
            echo "CSC_LINK=${cert_path}"
            echo "CSC_KEY_PASSWORD=${CSC_KEY_PASSWORD}"
            echo "APPLE_API_KEY=${key_path}"
            echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}"
            echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
            echo "MAC_SIGN=1"
          } >> "${GITHUB_ENV}"

      - name: Build macOS package (signed)
        if: ${{ inputs.mac_sign }}
        run: MAC_SIGN=1 npm run dist:mac:${{ matrix.arch }}

      - name: Build macOS package (unsigned)
        if: ${{ !inputs.mac_sign }}
        run: npm run dist:mac:${{ matrix.arch }}

      # 产物体积防回归守护：断言黑名单包（agent-sdk 平台二进制、@napi-rs/canvas、
      # renderer-only 依赖等）未混入产物。审计不过则不出包（阻止 upload）。
      # baseline 为 linux 口径，platform 不匹配时自动跳过体积对比，仅做黑名单断言。
      - name: Audit bundle (size & blacklist guard)
        shell: bash
        run: |
          set -uo pipefail
          echo "=== dist tree ==="; ls -la dist || true
          app_dir="$(find dist -maxdepth 2 -name '*.app' -type d | head -1)"
          if [[ -z "$app_dir" ]]; then
            echo "::error::未找到 .app 产物，无法审计"; exit 1
          fi
          echo "审计目标: $app_dir"
          node scripts/audit-bundle.mjs "$app_dir"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Claude360-Copilot-*-mac-${{ matrix.arch }}.dmg
            dist/Claude360-Copilot-*-mac-${{ matrix.arch }}.zip

  # ── Windows x64：NSIS 安装包 ───────────────────────────────────────────
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tag 触发时，用标签名（去掉 win-/v 前缀）作为发布版本号，供 electron-builder 命名。
      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/win-v')
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#win-}"
          ver="${ver#v}"
          echo "CLAUDE360_APP_VERSION=${ver}" >> "$GITHUB_ENV"

      # 分支 push 的 CI 构建：版本号 0.1.0-ci.N（合法 semver prerelease）。
      # CI 构建不进 Release/更新通道，版本仅用于产物命名与追踪。
      - name: Resolve CI version for branch build
        if: github.ref == 'refs/heads/ci/build-installers'
        shell: bash
        run: echo "CLAUDE360_APP_VERSION=0.1.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build Windows installer (x64)
        run: npm run dist:win

      # 产物体积防回归守护（同 macOS job 说明）。Windows 侧重点验证
      # agent-sdk-win32-x64 平台二进制混入已被 afterPack 清除。
      - name: Audit bundle (size & blacklist guard)
        shell: bash
        run: |
          set -uo pipefail
          echo "=== dist tree ==="; ls -la dist || true
          node scripts/audit-bundle.mjs dist/win-unpacked

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Claude360-Copilot-Windows-x64
          if-no-files-found: error
          retention-days: 14
          # latest.yml 必须随 artifact 上传：publish-release job 靠它发布
          # electron-updater 的 Windows 更新 feed。
          path: |
            dist/Claude360-Copilot-*-win-x64.exe
            dist/Claude360-Copilot-*-win-x64.exe.blockmap
            dist/Claude360-Copilot-*-win-x64.zip
            dist/latest.yml

  # ── 发布：tag 触发时汇总三平台产物发 GitHub Release ─────────────────────
  # mac 的 latest-mac.yml 必须在此合并生成：单架构 job 内各自生成会互相覆盖，
  # electron-updater 需要一份同时含 arm64+x64 zip 的 files 列表。
  # win-v* 时 build-macos 被 skip，用 always()+needs.result 显式判断保证仍可
  # 发布仅 Windows 的 Release；任一必需 job 失败则不发布。
  # Release tag 必须是 v<semver>：electron-updater GitHub provider 解析不了
  # win-v 前缀，因此 win-v* 触发也统一发布到 v<version>。
  # 版本号含 "-"（如 0.1.3-test.12）标记为 prerelease，对应 frontier 通道。
  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/win-v')) &&
      needs.build-windows.result == 'success' &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      # 需要仓库内容：generate-mac-latest.cjs 脚本 + annotated tag message 作 release notes。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate latest-mac.yml (merged arm64 + x64)
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-assets
          if compgen -G "release-assets/Claude360-Copilot-*-mac-*.zip" > /dev/null; then
            node scripts/generate-mac-latest.cjs release-assets
          else
            echo "No macOS artifacts (win-v* build) — skip latest-mac.yml"
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#win-}"
          ver="${ver#v}"
          tag="v${ver}"

          assets=()
          for f in release-assets/*.exe release-assets/*.exe.blockmap \
                   release-assets/*-win-*.zip release-assets/latest.yml \
                   release-assets/*-mac-*.dmg release-assets/*-mac-*.zip \
                   release-assets/latest-mac.yml; do
            [[ -e "$f" ]] && assets+=("$f")
          done
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::release-assets/ 中没有可发布的产物"
            exit 1
          fi

          prerelease_args=()
          if [[ "$ver" == *-* ]]; then
            prerelease_args=(--prerelease)
          fi

          notes_file=""
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          tag_object_type="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(objecttype)')"
          if [[ "$tag_object_type" == "tag" ]]; then
            tag_message="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')"
            if printf '%s' "$tag_message" | grep -q '[^[:space:]]'; then
              notes_file="${RUNNER_TEMP}/release-notes-${tag}.md"
              printf '%s\n' "$tag_message" > "$notes_file"
            fi
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            edit_args=(--repo "$GITHUB_REPOSITORY" --title "$tag" --target "$GITHUB_SHA")
            if [[ -n "$notes_file" ]]; then
              edit_args+=(--notes-file "$notes_file")
            fi
            gh release edit "$tag" "${edit_args[@]}"
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            notes_args=(--generate-notes)
            if [[ -n "$notes_file" ]]; then
              notes_args=(--notes-file "$notes_file")
            fi

            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              "${notes_args[@]}" \
              "${prerelease_args[@]}"
          fi
